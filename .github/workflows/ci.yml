# IKEA NonFuncReq / DevOps: manual QA pipeline (sequential, no Release step).
# Saves private-repo minutes: auto push/PR triggers stay disabled.
# For tag releases use Release workflow (runs the same template + release-package).
name: CI

on:
  workflow_dispatch:
    inputs:
      strict_lint:
        description: "Fail job if cpplint findings exist"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  # push:
  #   branches: [main, master, develop]
  # pull_request:
  #   branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  pipeline:
    uses: ./.github/workflows/release_template.yaml
    with:
      strict_lint: ${{ github.event.inputs.strict_lint == 'true' }}
      enable_firmware_build: ${{ vars.ENABLE_FIRMWARE_BUILD == 'true' }}
