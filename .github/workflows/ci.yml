# IKEA NonFuncReq / DevOps: CI pipeline in version control.
# Pipeline steps stay short; logic lives in scripts/ (see scripts/ci_local.sh).
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      strict_lint:
        description: "Fail job if cpplint findings exist"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: cpplint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cpplint
        run: bash scripts/linter/setup.sh

      - name: Run cpplint
        id: lint
        continue-on-error: ${{ github.event.inputs.strict_lint != 'true' && vars.CI_STRICT_LINT != 'true' }}
        run: bash scripts/linter/linter.sh -p

      - name: Upload cpplint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpplint-report
          path: code_quality_report/cpplint/
          if-no-files-found: warn

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl libpcre3-dev python3 python3-pip

      - name: Setup cppcheck
        run: bash scripts/cppcheck/setup.sh

      - name: Run cppcheck
        run: bash scripts/cppcheck/runner.sh

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: code_quality_report/cppcheck/
          if-no-files-found: warn

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    # Host unit tests need kt_components / unit_test scaffolding — enable when present.
    if: ${{ hashFiles('kt_components/**', 'unit_test/**') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcmocka-dev

      - name: Run unit tests
        run: bash scripts/unittest/runner.sh

  # Firmware build needs Silicon Labs SDK + ARM toolchain.
  # Use a self-hosted Linux runner labeled "silabs-sdk", or a Docker image Action (separate repo).
  firmware-build:
    name: firmware-build
    runs-on: ${{ vars.SILABS_RUNNER || 'ubuntu-latest' }}
    if: ${{ vars.ENABLE_FIRMWARE_BUILD == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: bash scripts/ci_local.sh --with-build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            artifact/**
            ZigbeeMatterLightSolution_SixG301M113W_cmake/build/**/*.s37
            ZigbeeMatterLightSolution_SixG301M113W_cmake/build/**/*.gbl
          if-no-files-found: warn
