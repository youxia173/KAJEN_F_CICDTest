# IKEA NonFuncReq / DevOps: sequential QA pipeline (no Release step).
# Public test repo: auto-runs on push/PR to main. Tag releases use release.yml.
name: CI

on:
  workflow_dispatch:
    inputs:
      strict_lint:
        description: "Fail job if cpplint findings exist"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  pipeline:
    uses: ./.github/workflows/release_template.yaml
    with:
      strict_lint: ${{ github.event.inputs.strict_lint == 'true' }}
      enable_firmware_build: ${{ vars.ENABLE_FIRMWARE_BUILD == 'true' }}
