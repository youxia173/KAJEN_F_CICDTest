# IKEA NonFuncReq / DevOps: CI pipeline in version control.
# Pipeline steps stay short; logic lives in scripts/ (see scripts/ci_local.sh).
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      strict_lint:
        description: "Fail job if cpplint findings exist"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: cpplint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cpplint
        run: bash scripts/linter/setup.sh

      - name: Run cpplint
        id: lint
        continue-on-error: ${{ github.event.inputs.strict_lint != 'true' && vars.CI_STRICT_LINT != 'true' }}
        run: bash scripts/linter/linter.sh -p

      - name: Upload cpplint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpplint-report
          path: code_quality_report/cpplint/
          if-no-files-found: warn

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl libpcre3-dev python3 python3-pip

      - name: Setup cppcheck
        run: bash scripts/cppcheck/setup.sh

      - name: Run cppcheck
        run: bash scripts/cppcheck/runner.sh

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: code_quality_report/cppcheck/
          if-no-files-found: warn

  unittest:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to run host unit tests
        id: decide
        shell: bash
        run: |
          if [ -d "kt_components" ] || [ -d "unit_test" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcmocka-dev

      - name: Run unit tests
        if: steps.decide.outputs.run == 'true'
        run: bash scripts/unittest/runner.sh

  # Firmware build needs Silicon Labs SDK + ARM toolchain (slt/ninja/arm-gcc/commander).
  # GitHub-hosted ubuntu-latest does not have SiSDK; use a self-hosted runner via SILABS_RUNNER.
  firmware-build:
    name: firmware-build
    runs-on: ${{ vars.SILABS_RUNNER || 'ubuntu-latest' }}
    if: ${{ vars.ENABLE_FIRMWARE_BUILD == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        env:
          # Cloud ubuntu has no SiSDK; skip instead of failing the whole CI.
          CI_ALLOW_SKIP_FIRMWARE: "true"
        run: bash scripts/ci_local.sh --build-only

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            artifact/**
            ZigbeeMatterLightSolution_SixG301M113W_cmake/build/**/*.s37
            ZigbeeMatterLightSolution_SixG301M113W_cmake/build/**/*.gbl
          if-no-files-found: ignore
