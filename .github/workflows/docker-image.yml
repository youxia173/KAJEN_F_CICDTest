# Build the full SiSDK firmware image and push to GitHub Container Registry (GHCR).
# First run is slow (slt downloads SDK). Re-run when docker/ changes or manually.
name: Build Docker image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kajen-sixg301
  IMAGE_TAG: sdk-2025.12.1

jobs:
  build-and-push:
    name: build-push-ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve GHCR image name
        id: meta
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${{ env.IMAGE_TAG }},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full firmware image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            INSTALL_SLT_PACKAGES=1

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Use in CI (repo variable, optional):"
          echo "  GHCR_FIRMWARE_IMAGE=${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}"
          echo ""
          echo "Then set ENABLE_FIRMWARE_BUILD=true and re-run CI."
