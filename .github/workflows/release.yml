# IKEA CD: tag push runs full pipeline CodeAnalysis → UnitTest → Build → Release.
# OTA upload to Homesmart is gated on ENABLE_OTA_UPLOAD (placeholder until API ready).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0) without leading v"
        required: true
      create_release:
        description: "Create GitHub Release after build (manual test)"
        required: false
        default: false
        type: boolean
      strict_lint:
        description: "Fail if cpplint reports findings"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  pipeline:
    uses: ./.github/workflows/release_template.yaml
    with:
      ref: ${{ github.ref }}
      strict_lint: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.strict_lint == true }}
      enable_firmware_build: true

  release-package:
    name: release-package
    needs: pipeline
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: .

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: version not provided and ref is not a v* tag" >&2
            exit 1
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC1091
          source scripts/release/project.env
          echo "zip=${IKEA_PROJECT_ID}-${VER}-unsigned.zip" >> "$GITHUB_OUTPUT"

      - name: Package unsigned release zip
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/release/package_release.sh "${{ steps.ver.outputs.version }}" release_out
          sed -i "s/\${GITHUB_SHA:-local}/${{ github.sha }}/" release_out/RELEASE_NOTES.md

      - name: Download quality reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: code_quality_report|unit_test_report
          path: release_out/extra
          merge-multiple: true

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: |
            release_out/${{ steps.ver.outputs.zip }}
            release_out/RELEASE_NOTES.md
            release_out/extra/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release_out/RELEASE_NOTES.md
          files: |
            release_out/${{ steps.ver.outputs.zip }}
            release_out/extra/code_quality_report.tar.gz
            release_out/extra/unit_test_report.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ota-upload:
    name: homesmart-ota
    needs: release-package
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_OTA_UPLOAD == 'true' && (github.event_name == 'push' || github.event.inputs.create_release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          VER="${VER#v}"
          source scripts/release/project.env
          echo "zip=${IKEA_PROJECT_ID}-${VER}-unsigned.zip" >> "$GITHUB_OUTPUT"

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release_out
          merge-multiple: true

      - name: Upload to Homesmart OTA (placeholder)
        env:
          IKEA_OTA_API_URL: ${{ secrets.IKEA_OTA_API_URL }}
          IKEA_OTA_TOKEN: ${{ secrets.IKEA_OTA_TOKEN }}
        run: |
          if [[ -z "${IKEA_OTA_API_URL}" || -z "${IKEA_OTA_TOKEN}" ]]; then
            echo "ERROR: set secrets IKEA_OTA_API_URL and IKEA_OTA_TOKEN" >&2
            exit 1
          fi
          FW="$(ls release_out/${{ steps.ver.outputs.zip }} | head -1)"
          echo "TODO: call Homesmart OTA API with ${FW}"
          echo "API=${IKEA_OTA_API_URL}"
          ls -la release_out
          exit 0
