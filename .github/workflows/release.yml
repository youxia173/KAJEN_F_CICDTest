# IKEA CD: tag push runs full pipeline CodeAnalysis → UnitTest → Build → Release.
# OTA upload to Homesmart is gated on ENABLE_OTA_UPLOAD (placeholder until API ready).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.6) without leading v"
        required: true
      create_release:
        description: "Create GitHub Release after build (manual test)"
        required: false
        default: false
        type: boolean
      strict_lint:
        description: "Fail if cpplint reports findings"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  pipeline:
    uses: ./.github/workflows/release_template.yaml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
      run_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true) }}
      strict_lint: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.strict_lint == true }}
      enable_firmware_build: true

  ota-upload:
    name: homesmart-ota
    needs: pipeline
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_OTA_UPLOAD == 'true' && (github.event_name == 'push' || github.event.inputs.create_release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          VER="${VER#v}"
          source scripts/release/project.env
          echo "zip=${IKEA_PROJECT_ID}-${VER}-unsigned.zip" >> "$GITHUB_OUTPUT"

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release_out
          merge-multiple: true

      - name: Upload to Homesmart OTA (placeholder)
        env:
          IKEA_OTA_API_URL: ${{ secrets.IKEA_OTA_API_URL }}
          IKEA_OTA_TOKEN: ${{ secrets.IKEA_OTA_TOKEN }}
        run: |
          if [[ -z "${IKEA_OTA_API_URL}" || -z "${IKEA_OTA_TOKEN}" ]]; then
            echo "ERROR: set secrets IKEA_OTA_API_URL and IKEA_OTA_TOKEN" >&2
            exit 1
          fi
          FW="$(ls release_out/${{ steps.ver.outputs.zip }} | head -1)"
          echo "TODO: call Homesmart OTA API with ${FW}"
          echo "API=${IKEA_OTA_API_URL}"
          ls -la release_out
          exit 0
